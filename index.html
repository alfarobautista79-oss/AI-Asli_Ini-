    <div class="app">
      <aside class="sidebar" aria-label="Navigasi utama">
        <div class="brand">
          <button
            class="brand-mark"
            type="button"
            data-view="overview"
            aria-label="Kembali ke Ringkasan kota"
          >
            <img
              src="assets/laci-logo-new.svg"
              alt="Logo Laci Lampung Smart City"
            />
          </button>
          <div>
            <div class="brand-name">Laci</div>
            <div class="brand-caption">Lampung Smart City</div>
          </div>
        </div>
        <nav class="side-scroll" id="navigation"></nav>
        <div class="side-bottom">
          <div class="city-chip">
            <span class="city-pulse"></span>
            <div>
              <strong>Kota Bandar Lampung</strong>
              <span>Sistem kota beroperasi</span>
            </div>
          </div>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <button
            class="icon-button menu-toggle"
            id="menu-toggle"
            aria-label="Buka navigasi"
          >
            <svg><use href="#i-menu" /></svg>
          </button>
          <div class="crumbs">
            <span>LACI</span>
            <span class="crumb-mark">/</span>
            <b id="breadcrumb">Ringkasan kota</b>
          </div>
          <a class="button home-button" href="landing.html">
            <svg>
              <use href="#i-home" />
            </svg>
            <span>Beranda</span>
          </a>
          <div class="top-actions">
            <button
              class="icon-button"
              id="notification-button"
              aria-label="Buka notifikasi"
            >
              <svg>
                <use href="#i-bell" />
              </svg>
              <span class="notification-dot"></span>
            </button>
            <img
              class="avatar"
              src="https://iili.io/na6wZ92.png"
              alt="Profil pengguna"
            />
          </div>
        </header>
        <section class="content" id="view" aria-live="polite"></section>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" hidden>
      <svg>
        <use href="#i-check" />
      </svg>
